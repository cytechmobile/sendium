name: Run Tests

on:
   push:
   pull_request:

concurrency:
  group: SendiumTests-${{github.ref}}
  cancel-in-progress: true

jobs:
  classify:
    # A release branch push is followed by a PR run; main always gets full CI.
    if: >-
      !(github.event_name == 'push' &&
        github.actor == 'cytech-release-bot[bot]' &&
        startsWith(github.ref, 'refs/heads/release-please--'))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release-only: ${{ steps.classify.outputs.release-only }}
    steps:
      - name: Identify version-only release PR
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            let releaseOnly = false;
            if (pr && pr.user.login === 'cytech-release-bot[bot]' &&
                pr.head.repo?.full_name === context.payload.repository.full_name &&
                pr.head.ref.startsWith('release-please--') && pr.base.ref === 'main') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const poms = new Set([
                'pom.xml', 'sendium-core/pom.xml', 'sendium-app/pom.xml',
                'performance/harness/pom.xml',
              ]);
              releaseOnly = files.length > 0 && files.length === pr.changed_files && files.every(file => {
                if (file.status !== 'modified' || !file.patch) return false;
                if (file.filename === 'CHANGELOG.md') return true;
                const changes = file.patch.split('\n').filter(line => /^[+-]/.test(line));
                if (file.filename === '.release-please-manifest.json') {
                  return changes.length > 0 && changes.every(line =>
                    /^[+-]\s*"\.": "\d+\.\d+\.\d+(?:[-+][\w.-]+)?"\s*$/.test(line));
                }
                return poms.has(file.filename) && changes.length > 0 && changes.every(line =>
                  /^[+-]\s*<version>\d+\.\d+\.\d+(?:[-+][\w.-]+)?<\/version>(?:\s*<!-- x-release-please-version -->)?\s*$/.test(line));
              });
            }
            core.setOutput('release-only', String(releaseOnly));

  quick-start:
    needs: classify
    if: needs.classify.outputs.release-only != 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test quick-start generator
        run: sh tests/quick-start-test.sh

  tests:
    needs: classify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendium
          POSTGRES_USER: sendium
          POSTGRES_PASSWORD: sendium-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendium -d sendium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java
        id: setup_java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Backend
        run: |
          export QUARKUS_LOG_LEVEL=ERROR
          chmod +x ./mvnw
          ./mvnw -B -ntp -V -e verify
      - name: Upload backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sendium-core/target/surefire-reports/
            sendium-core/target/failsafe-reports/
            sendium-app/target/surefire-reports/
            sendium-app/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build quick-start test image
        if: needs.classify.outputs.release-only != 'true'
        run: docker build -t sendium:quick-start-test -f sendium-app/src/main/docker/Dockerfile.jvm sendium-app
      - name: Test generated container startup
        if: needs.classify.outputs.release-only != 'true'
        env:
          SENDIUM_TEST_IMAGE: sendium:quick-start-test
        run: sh tests/quick-start-test.sh
      - name: Test PostgreSQL restart behavior on JVM
        if: needs.classify.outputs.release-only != 'true'
        env:
          SENDIUM_E2E_IMAGE: sendium:quick-start-test
          SENDIUM_DLR_POSTGRESQL_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/sendium
          SENDIUM_DLR_POSTGRESQL_USERNAME: sendium
          SENDIUM_DLR_POSTGRESQL_PASSWORD: sendium-test
        run: |
          ./mvnw -B -pl sendium-core -DskipTests test-compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=utils.NativeE2eSmoke
      - id: result
        name: Sendium Test Result
        if: always()
        run: |
          echo "result=${{job.status}}" >> "$GITHUB_ENV"
          echo "result=${{job.status}}" >> "$GITHUB_OUTPUT"
      - name: Google Chat Notification
        uses: jchrist/google-chat-github-action@v1
        with:
          name: Sendium Build
          url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ job.status }}
        if: always()
        continue-on-error: true
  automerge-dependabot:
    needs: [quick-start, tests]
    if: success() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Auto-merge Dependabot PRs
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          echo "found successful dependabot PR, merging it"
          gh pr merge "${{ github.event.pull_request.number }}" --auto --rebase
