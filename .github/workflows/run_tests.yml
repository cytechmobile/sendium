name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: SendiumTests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    # Only main pushes run automatically; PRs validate their merge ref, including release branches.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release-only: ${{ steps.classify.outputs.release-only }}
    steps:
      - name: Identify version-only release PR
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            let releaseOnly = false;
            if (pr && pr.user.login === 'cytech-release-bot[bot]' &&
                pr.head.repo?.full_name === context.payload.repository.full_name &&
                pr.head.ref.startsWith('release-please--') && pr.base.ref === 'main') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const poms = new Set([
                'pom.xml', 'sendium-core/pom.xml', 'sendium-app/pom.xml',
                'performance/harness/pom.xml',
              ]);
              releaseOnly = files.length > 0 && files.length === pr.changed_files && files.every(file => {
                if (file.status !== 'modified' || !file.patch) return false;
                if (file.filename === 'CHANGELOG.md') return true;
                const changes = file.patch.split('\n').filter(line => /^[+-]/.test(line));
                if (file.filename === '.release-please-manifest.json') {
                  return changes.length > 0 && changes.every(line =>
                    /^[+-]\s*"\.": "\d+\.\d+\.\d+(?:[-+][\w.-]+)?"\s*$/.test(line));
                }
                return poms.has(file.filename) && changes.length > 0 && changes.every(line =>
                  /^[+-]\s*<version>\d+\.\d+\.\d+(?:[-+][\w.-]+)?<\/version>(?:\s*<!-- x-release-please-version -->)?\s*$/.test(line));
              });
            }
            core.setOutput('release-only', String(releaseOnly));

  quick-start:
    needs: classify
    if: needs.classify.outputs.release-only != 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test quick-start generator
        run: sh tests/quick-start-test.sh

  tests:
    needs: classify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendium
          POSTGRES_USER: sendium
          POSTGRES_PASSWORD: sendium-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendium -d sendium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java
        id: setup_java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Backend
        id: backend_build
        run: |
          export QUARKUS_LOG_LEVEL=ERROR
          chmod +x ./mvnw
          started_at=$(date +%s)
          verify_status=0
          ./mvnw -B -ntp -V -e verify || verify_status=$?
          if ! printf 'elapsed-seconds=%s\n' "$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"; then
            echo "::warning::Maven timing unavailable; preserving verification exit status."
          fi
          exit "$verify_status"
      - name: Upload backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sendium-core/target/surefire-reports/
            sendium-core/target/failsafe-reports/
            sendium-app/target/surefire-reports/
            sendium-app/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build quick-start test image
        if: needs.classify.outputs.release-only != 'true'
        run: docker build -t sendium:quick-start-test -f sendium-app/src/main/docker/Dockerfile.jvm sendium-app
      - name: Test generated container startup
        if: needs.classify.outputs.release-only != 'true'
        env:
          SENDIUM_TEST_IMAGE: sendium:quick-start-test
        run: sh tests/quick-start-test.sh
      - name: Test packaged DLR modes and default memory capacity on JVM
        if: needs.classify.outputs.release-only != 'true'
        env:
          SENDIUM_E2E_IMAGE: sendium:quick-start-test
          SENDIUM_DLR_POSTGRESQL_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/sendium
          SENDIUM_DLR_POSTGRESQL_USERNAME: sendium
          SENDIUM_DLR_POSTGRESQL_PASSWORD: sendium-test
          SENDIUM_E2E_TIMING_FILE: ${{ runner.temp }}/jvm-scenarios.tsv
          SENDIUM_E2E_TIMING_RUNTIME: jvm
        run: |
          ./mvnw -B -pl sendium-core -DskipTests test-compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=utils.NativeE2eSmoke
          # File mode passes no PostgreSQL settings to the container and uses a retained DLR volume.
          SENDIUM_E2E_DLR_BACKEND=file ./mvnw -B -pl sendium-core -DskipTests test-compile \
            org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=utils.NativeE2eSmoke
          # Run sequentially: all modes share the harness HTTP and SMPP ports.
          # Memory includes the 100,000-entry full-application proof at a fixed 512 MiB G1 heap.
          for backend in memory disabled; do
            SENDIUM_E2E_DLR_BACKEND="$backend" ./mvnw -B -pl sendium-core -DskipTests test-compile \
              org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
              -Dexec.classpathScope=test \
              -Dexec.mainClass=utils.NativeE2eSmoke
          done
      - name: Test JVM timing collectors
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts/timing/tests -p 'test_*.py'
      - name: Publish JVM timing summary
        if: always()
        continue-on-error: true
        env:
          TIMING_BUILD_SECONDS: ${{ steps.backend_build.outputs.elapsed-seconds }}
          TIMING_BUILD_OUTCOME: ${{ steps.backend_build.outcome }}
          TIMING_RUNNER_LABEL: ubuntu-latest
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/timing/java_reports.py \
            --reports sendium-core/target/surefire-reports \
            --reports sendium-core/target/failsafe-reports \
            --reports sendium-app/target/surefire-reports \
            --output "$RUNNER_TEMP/jvm-timing" \
            --build-seconds "$TIMING_BUILD_SECONDS" \
            --build-outcome "$TIMING_BUILD_OUTCOME"
      - name: Publish packaged JVM scenario timings
        if: always() && needs.classify.outputs.release-only != 'true'
        continue-on-error: true
        env:
          TIMING_RUNNER_LABEL: ubuntu-latest
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/timing/scenario_reports.py \
            --input "$RUNNER_TEMP/jvm-scenarios.tsv" \
            --output "$RUNNER_TEMP/jvm-timing" \
            --expected-backend postgresql --expected-backend file \
            --expected-backend memory --expected-backend disabled
      - name: Upload JVM timing artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: timing-jvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jvm-timing/
          if-no-files-found: warn
          retention-days: 30
      - id: result
        name: Sendium Test Result
        if: always()
        run: |
          echo "result=${{job.status}}" >> "$GITHUB_ENV"
          echo "result=${{job.status}}" >> "$GITHUB_OUTPUT"
      - name: Google Chat Notification
        uses: jchrist/google-chat-github-action@v1
        with:
          name: Sendium Build
          url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ job.status }}
        if: always()
        continue-on-error: true
  automerge-dependabot:
    needs: [quick-start, tests]
    if: success() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Auto-merge Dependabot PRs
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          echo "found successful dependabot PR, merging it"
          gh pr merge "${{ github.event.pull_request.number }}" --auto --rebase
