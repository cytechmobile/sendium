name: Run Tests

on:
   push:
   pull_request:

concurrency:
  group: SendiumTests-${{github.ref}}
  cancel-in-progress: true

jobs:
  quick-start:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test quick-start generator
        run: sh tests/quick-start-test.sh

  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendium
          POSTGRES_USER: sendium
          POSTGRES_PASSWORD: sendium-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendium -d sendium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java
        id: setup_java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Backend
        run: |
          export QUARKUS_LOG_LEVEL=ERROR
          chmod +x ./mvnw
          ./mvnw verify -Ppostgresql-tests
      - name: Build quick-start test image
        run: docker build -t sendium:quick-start-test -f sendium-app/src/main/docker/Dockerfile.jvm sendium-app
      - name: Test generated container startup
        env:
          SENDIUM_TEST_IMAGE: sendium:quick-start-test
        run: sh tests/quick-start-test.sh
      - name: Test PostgreSQL restart behavior on JVM
        env:
          SENDIUM_E2E_IMAGE: sendium:quick-start-test
          SENDIUM_DLR_POSTGRESQL_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/sendium
          SENDIUM_DLR_POSTGRESQL_USERNAME: sendium
          SENDIUM_DLR_POSTGRESQL_PASSWORD: sendium-test
        run: |
          ./mvnw -B -pl sendium-core -DskipTests test-compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=utils.NativeE2eSmoke
      - id: result
        name: Sendium Test Result
        if: always()
        run: |
          echo "result=${{job.status}}" >> "$GITHUB_ENV"
          echo "result=${{job.status}}" >> "$GITHUB_OUTPUT"
      - name: Cancel current workflow run
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            })
      - name: Google Chat Notification
        uses: jchrist/google-chat-github-action@v1
        with:
          name: Sendium Build
          url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ job.status }}
        if: always()
        continue-on-error: true
  automerge-dependabot:
    needs: [quick-start, tests]
    if: success() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Auto-merge Dependabot PRs
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          echo "found successful dependabot PR, merging it"
          gh pr merge "${{ github.event.pull_request.number }}" --auto --rebase
