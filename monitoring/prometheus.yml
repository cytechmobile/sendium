global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: sendium
    metrics_path: /q/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          application: sendium
