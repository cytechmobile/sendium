%test.smsg.routing.file.path=src/test/resources/routingTable.conf
%test.smsg.properties.file.path=src/test/resources/smsg.properties
%test.smsg.credentials.file.path=src/test/resources/credentials.yml

# Sendium-owned DLR persistence is opt-in and is enabled by the standalone application.
# The flag is deliberately left undefined here: the DLR beans use enableIfMissing=false, so an embedding
# application enables the subsystem by declaring the property itself rather than by overriding this file.
quarkus.datasource.devservices.enabled=false
quarkus.datasource.dlr.db-kind=postgresql
quarkus.datasource.dlr.active=${sendium.dlr.persistence.enabled:false}
quarkus.datasource.dlr.devservices.enabled=false
quarkus.datasource.dlr.jdbc.min-size=0
quarkus.datasource.dlr.jdbc.max-size=10
quarkus.datasource.dlr.jdbc.acquisition-timeout=5S
quarkus.datasource.metrics.enabled=true
quarkus.flyway.dlr.locations=db/sendium-dlr/postgresql
quarkus.flyway.dlr.active=${quarkus.datasource.dlr.active}
quarkus.flyway.dlr.migrate-at-start=${quarkus.datasource.dlr.active}
quarkus.flyway.dlr.validate-on-migrate=true
quarkus.flyway.dlr.clean-disabled=true
quarkus.flyway.dlr.schemas=sendium_dlr
quarkus.flyway.dlr.default-schema=sendium_dlr
quarkus.flyway.dlr.table=flyway_schema_history
quarkus.flyway.dlr.create-schemas=true
